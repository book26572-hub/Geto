name: Build application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle (Ignore All Errors)
      run: ./gradlew assembleDebug -x spotlessCheck -x test -x lint || echo "Ignoring spotless formatting blocks"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Geto-Forced-APK
        path: "**/build/outputs/apk/debug/*.apk"

